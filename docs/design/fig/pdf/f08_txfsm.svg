<svg xmlns="http://www.w3.org/2000/svg" width="760" height="415" viewBox="0 0 760 415">
<style>
text { font-family: Helvetica, Arial, sans-serif; fill: #000; }
.st { fill: #fff; stroke: #000; stroke-width: 1.4; }
.st0 { fill: #e6e6e6; stroke: #000; stroke-width: 1.4; }
.ed { fill: none; stroke: #000; stroke-width: 1.2; }
.ed2 { fill: none; stroke: #000; stroke-width: 1.2; stroke-dasharray: 5 3; }
.box { fill: #fff; stroke: #000; stroke-width: 1.2; }
.gray { fill: #e0e0e0; stroke: #000; stroke-width: 1.2; }
.hatch { fill: url(#hatch); stroke: #000; stroke-width: 1.2; stroke-dasharray: 4 2; }
.thin { fill: none; stroke: #000; stroke-width: 0.8; }
</style>
<defs>
<marker id="ar" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="7" refX="9.5" refY="3.5" orient="auto">
<polygon points="0 0, 10 3.5, 0 7" fill="#000"/></marker>
<pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
<rect width="6" height="6" fill="#fff"/><line x1="0" y1="0" x2="0" y2="6" stroke="#777" stroke-width="1.2"/></pattern>
</defs>
<circle cx="90" cy="200" r="40" class="st0"/>
<text x="90.0" y="198.0" font-size="14.4" text-anchor="middle" font-weight="bold">INIT</text>
<text x="90.0" y="213.0" font-size="10.8" text-anchor="middle" font-weight="normal">clear tables</text>
<circle cx="320" cy="200" r="46" class="st"/>
<text x="320.0" y="198.0" font-size="14.4" text-anchor="middle" font-weight="bold">IDLE</text>
<text x="320.0" y="213.0" font-size="10.8" text-anchor="middle" font-weight="normal">scan</text>
<circle cx="600" cy="55" r="40" class="st"/>
<text x="600.0" y="59.0" font-size="14.4" text-anchor="middle" font-weight="bold">START</text>
<circle cx="660" cy="200" r="40" class="st"/>
<text x="660.0" y="204.0" font-size="14.4" text-anchor="middle" font-weight="bold">ENQ</text>
<circle cx="600" cy="345" r="40" class="st"/>
<text x="600.0" y="349.0" font-size="14.4" text-anchor="middle" font-weight="bold">GRANT</text>
<path d="M 130.0 200.0 L 274.0 200.0" class="ed" marker-end="url(#ar)"/>
<text x="202.0" y="191.5" font-size="12.0" text-anchor="middle" font-weight="normal">init_flush</text>
<path d="M 357.6 172.6 L 561.3 67.2" class="ed" marker-end="url(#ar)"/>
<path d="M 567.7 79.6 L 364.1 185.1" class="ed" marker-end="url(#ar)"/>
<path d="M 366.0 193.0 L 620.0 193.0" class="ed" marker-end="url(#ar)"/>
<path d="M 620.0 207.0 L 366.0 207.0" class="ed" marker-end="url(#ar)"/>
<path d="M 364.1 214.9 L 567.7 320.4" class="ed" marker-end="url(#ar)"/>
<path d="M 561.3 332.8 L 357.6 227.4" class="ed" marker-end="url(#ar)"/>
<text x="445.0" y="108.0" font-size="12.0" text-anchor="end" font-weight="normal">(1) start ack</text>
<text x="478.0" y="150.0" font-size="12.0" text-anchor="start" font-weight="normal">next_time = t_start + BAG</text>
<text x="490.0" y="187.0" font-size="12.0" text-anchor="middle" font-weight="normal">(2) enqueue req</text>
<text x="490.0" y="225.0" font-size="12.0" text-anchor="middle" font-weight="normal">accept / reject</text>
<text x="478.0" y="256.0" font-size="12.0" text-anchor="start" font-weight="normal">fields to builder,</text>
<text x="478.0" y="270.0" font-size="12.0" text-anchor="start" font-weight="normal">pend_vl = vl</text>
<text x="468.0" y="316.0" font-size="12.0" text-anchor="end" font-weight="normal">(3) candidate &amp;</text>
<text x="468.0" y="330.0" font-size="12.0" text-anchor="end" font-weight="normal">builder slot free</text>
<path d="M 343.0 239.8 C 379.8 305.8 260.2 305.8 297.0 239.8" class="ed" marker-end="url(#ar)"/>
<text x="250.0" y="323.7" font-size="12.0" text-anchor="middle" font-weight="normal">no request: read one VL</text>
<text x="250.0" y="336.7" font-size="12.0" text-anchor="middle" font-weight="normal">every 2 cycles (pipelined)</text>
<text x="745.0" y="405.0" font-size="12.0" text-anchor="end" font-weight="normal" font-style="italic">Priority: (1) &gt; (2) &gt; (3)</text>
</svg>
