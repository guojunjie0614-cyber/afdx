<text x="420.0" y="163.0" font-size="10.8" text-anchor="middle" font-weight="normal">1 B / cycle</text>
<circle cx="420" cy="330" r="38" class="st"/>
<text x="420.0" y="328.0" font-size="14.4" text-anchor="middle" font-weight="bold">FCS</text>
<text x="420.0" y="343.0" font-size="10.8" text-anchor="middle" font-weight="normal">4 bytes</text>
<circle cx="140" cy="330" r="38" class="st"/>
