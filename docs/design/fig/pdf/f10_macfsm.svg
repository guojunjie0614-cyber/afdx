<text x="790.0" y="97.5" font-size="12.0" text-anchor="middle" font-weight="normal">first byte D5</text>
<path d="M 646.1 177.6 L 763.9 302.4" class="ed" marker-end="url(#ar)"/>
<text x="652.0" y="262.0" font-size="12.0" text-anchor="end" font-weight="normal">first byte</text>
<text x="652.0" y="275.0" font-size="12.0" text-anchor="end" font-weight="normal">not 55 / D5</text>
<path d="M 790.0 188.0 L 790.0 292.0" class="ed" marker-end="url(#ar)"/>
<text x="798.0" y="245.0" font-size="12.0" text-anchor="start" font-weight="normal">not 55 / D5</text>
<text x="960.0" y="300.0" font-size="12.0" text-anchor="middle" font-weight="normal" font-style="italic">Any state: rx_valid low</text>
<text x="960.0" y="314.0" font-size="12.0" text-anchor="middle" font-weight="normal" font-style="italic">-&gt; IDLE with f_end and</text>
<text x="960.0" y="328.0" font-size="12.0" text-anchor="middle" font-weight="normal" font-style="italic">f_err = ok / FCS / len / pre</text>
<text x="790.0" y="410.0" font-size="14.4" text-anchor="middle" font-weight="bold">(b) afdx_mac_rx</text>
