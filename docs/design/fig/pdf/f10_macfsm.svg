<text x="430.0" y="237.5" font-size="12.0" text-anchor="start" font-weight="normal">s_last sent</text>
<text x="430.0" y="249.5" font-size="12.0" text-anchor="start" font-weight="normal">or underrun</text>
<path d="M 276.1 177.6 L 393.9 302.4" class="ed2" marker-end="url(#ar)"/>
<text x="313.2" y="264.1" font-size="12.0" text-anchor="middle" font-weight="normal">underrun</text>
