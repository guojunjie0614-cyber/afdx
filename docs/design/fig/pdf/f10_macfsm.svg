<text x="790.0" y="148.0" font-size="14.4" text-anchor="middle" font-weight="bold">PRE</text>
<text x="790.0" y="163.0" font-size="10.8" text-anchor="middle" font-weight="normal">wait D5</text>
<circle cx="960" cy="150" r="38" class="st"/>
<text x="960.0" y="148.0" font-size="14.4" text-anchor="middle" font-weight="bold">FRAME</text>
<text x="960.0" y="163.0" font-size="10.8" text-anchor="middle" font-weight="normal">CRC + length</text>
