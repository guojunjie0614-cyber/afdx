<text x="250.0" y="410.0" font-size="14.4" text-anchor="middle" font-weight="bold">(a) afdx_mac_tx</text>
<circle cx="620" cy="150" r="38" class="st0"/>
<text x="620.0" y="148.0" font-size="14.4" text-anchor="middle" font-weight="bold">IDLE</text>
<text x="620.0" y="163.0" font-size="10.8" text-anchor="middle" font-weight="normal">armed</text>
