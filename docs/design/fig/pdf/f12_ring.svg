<svg xmlns="http://www.w3.org/2000/svg" width="850" height="236" viewBox="0 0 850 236">
<style>
text { font-family: Helvetica, Arial, sans-serif; fill: #000; }
.st { fill: #fff; stroke: #000; stroke-width: 1.4; }
.st0 { fill: #e6e6e6; stroke: #000; stroke-width: 1.4; }
.ed { fill: none; stroke: #000; stroke-width: 1.2; }
.ed2 { fill: none; stroke: #000; stroke-width: 1.2; stroke-dasharray: 5 3; }
.box { fill: #fff; stroke: #000; stroke-width: 1.2; }
.gray { fill: #e0e0e0; stroke: #000; stroke-width: 1.2; }
.hatch { fill: url(#hatch); stroke: #000; stroke-width: 1.2; stroke-dasharray: 4 2; }
.thin { fill: none; stroke: #000; stroke-width: 0.8; }
</style>
<defs>
<marker id="ar" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="7" refX="9.5" refY="3.5" orient="auto">
<polygon points="0 0, 10 3.5, 0 7" fill="#000"/></marker>
<pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
<rect width="6" height="6" fill="#fff"/><line x1="0" y1="0" x2="0" y2="6" stroke="#777" stroke-width="1.2"/></pattern>
</defs>
<rect x="40.0" y="90" width="106.4" height="46" class="box"/>
<text x="93.2" y="117.0" font-size="12.0" text-anchor="middle" font-weight="normal">free</text>
<rect x="146.4" y="90" width="288.8" height="46" class="gray"/>
<text x="290.8" y="117.0" font-size="12.0" text-anchor="middle" font-weight="bold">committed, waiting for rx_deliver</text>
<rect x="435.2" y="90" width="167.2" height="46" class="hatch"/>
<text x="518.8" y="117.0" font-size="12.0" text-anchor="middle" font-weight="bold">current frame (trial)</text>
<rect x="602.4" y="90" width="197.6" height="46" class="box"/>
<text x="701.2" y="117.0" font-size="12.0" text-anchor="middle" font-weight="normal">free</text>
<path d="M 146.4 56 L 146.4 88" class="ed" marker-end="url(#ar)"/>
<text x="146.4" y="38.0" font-size="13.2" text-anchor="middle" font-weight="bold">rd</text>
<text x="146.4" y="51.0" font-size="10.8" text-anchor="middle" font-weight="normal">rx_deliver</text>
<path d="M 435.2 56 L 435.2 88" class="ed" marker-end="url(#ar)"/>
<text x="435.2" y="38.0" font-size="13.2" text-anchor="middle" font-weight="bold">wr_commit</text>
<text x="435.2" y="51.0" font-size="10.8" text-anchor="middle" font-weight="normal">rx_parse</text>
<path d="M 602.4 56 L 602.4 88" class="ed" marker-end="url(#ar)"/>
<text x="602.4" y="38.0" font-size="13.2" text-anchor="middle" font-weight="bold">wr_trial</text>
<text x="602.4" y="51.0" font-size="10.8" text-anchor="middle" font-weight="normal">rx_parse</text>
<path d="M 804 113.0 L 822 113.0 L 822 216 L 18 216 L 18 113.0 L 36 113.0" class="thin" marker-end="url(#ar)"/>
<text x="420.0" y="212.0" font-size="10.8" text-anchor="middle" font-weight="normal" font-style="italic">wrap: 2^RX_RING_AW = 4096 bytes per network, pointers carry one extra bit</text>
<text x="518.8" y="166.0" font-size="12.0" text-anchor="middle" font-weight="normal">commit: wr_commit &lt;= wr_trial</text>
<text x="518.8" y="180.0" font-size="12.0" text-anchor="middle" font-weight="normal">rollback: wr_trial &lt;= wr_commit</text>
<text x="290.8" y="166.0" font-size="12.0" text-anchor="middle" font-weight="normal">free = 4096 - (wr_commit - rd)</text>
</svg>
