        <style>
rect[class^="c-"], path[class^="c-"] { fill: none; stroke: #000; stroke-width: 1; }
text { font-family: Helvetica, Arial, sans-serif; fill: #000; }
.t-dim { fill: #000; font-weight: 600; }
.c-lane { fill: #f4f4f4; stroke: #000; stroke-width: 0.8; }
