schema: afdx-hardware-contract-v1
revision: 7
status: verified
spec_revision: 2
architecture:
  external_ports: Preserve the AFDX_top external interface and 172 physical pins; afdx_es adds an internal two-bit app_cfg_ready connection to the wrapper. Packet length is implicit in stream last/valid.
  owner_boundaries:
    tx: [afdx_app_tx, afdx_tx_buf, afdx_tx_engine, afdx_tx_builder, afdx_tx_core, afdx_tx_free]
    rx: [afdx_app_rx, afdx_rx_parse, afdx_rx_engine, afdx_rx_deliver, afdx_rx_core, afdx_rx_reassembly]
    timing: [afdx_rtc, afdx_cfg, afdx_snmp, afdx_ntp_fraction]
    parent: [AFDX_top, afdx_es, afdx_app_map, afdx_app_read, build_filelists, final_constraints]
  app_storage:
    address_width: 15
    depth_bytes: 32768
    payload_ram: afdx_app_payload; eight logical 4096x9 single-read/single-write synchronous banks per application ring, each implemented as four independent 1024x9 physical slices. Local registered read/write commands, addresses and E2 results precede selection; bank selection uses address bits 14:12 and slice selection uses bits 11:10. Total capacity remains 32768 bytes per ring. Each physical slice retains an independent storage hierarchy and write-data isolation; mapped RAM count and returned-data mux timing require the next full EDA result.
    payload_write_latency: An internal payload command accepted at E0 reaches physical RAM at E1; TX descriptor and committed pointer publish at E1. Application RX captures the complete external byte and configuration commands at E0, issues its local payload command at E1, and publishes committed/descriptor state with the physical write at E2; its output/drop boundary gains one clock.
    payload_read_latency: Four clocks; local command/address at E0, physical slice RAM at E1, slice-local result at E2, registered slice/bank selection at E3, consumed by reader at E4. Read-enable and bank/slice selection are captured separately and combined locally at the RAM. One-hot selection follows the same E0/E1/E2 tags and bank-local four-way masked returns. TX splits the E3 gather into two independent four-bank masked result registers; the E4 reader input ORs those groups without an extra edge. RX retains its existing E3 gather. Data, tags and total reader latency remain aligned.
    reader_credit: afdx_app_read READ_LATENCY defaults to 1 for existing callers; app TX/RX use 4. Eight reserved credits cover pending reads, queued bytes, both explicit output FF slots and an external take awaiting one-clock local retirement. reserved equals actual occupied credits plus take_q; credit returns only when the captured external take retires. Moving a queued byte into an output slot does not return credit. No additional outer TX byte queue is used.
    tx_lookup: One sixteen-bit descriptor-RAM-local query capture feeds the original 32 local copies, each serving four identifier comparisons; replacing eight identical first-stage captures preserves the capture/comparison stages and lowest-index priority. Configuration captures at E0, fans into eight local banks at E1 and four-entry data/write-select groups at E2, and retires to the table at E3. Queries wait or restart through accepted configuration retirement; writes may arrive every clock. Query/reduction datapaths continue sampling while configuration is busy; only FSM tags authorize consumption, and current message VL remains stable. Descriptor last-take retires locally one clock later; effective head equals desc_rd plus retire_q and drives descriptor occupancy and RAM address. The last external take captures the existing retire token; public valid/reader-ready are suppressed during retirement, and the following local state transition directly enters the same next-descriptor query state that the old idle transition selected on that edge. Empty queues and configuration busy retain the original quiet behavior. Descriptor RAM reads use local nonempty qualification to avoid empty-queue read/write collision; configuration busy does not gate its datapath.
    reader_issuance: TX may enable a local available prediction using an explicit next-limit input that describes the caller's same-edge committed-pointer update. After each edge available equals the updated reader pointer differing from the updated committed pointer; issue still requires reserved below eight. Reset, descriptor publication, stores and rollback must retain this equality and the original issue cycles. Default standalone readers keep their original limit semantics and do not consume an unconnected prediction input.
    rx_payload_data_capture: RX may pre-capture the complete raw byte/last at E0 into four local bank-pair copies, each serving two banks at E1. The original E0 ownership/valid/address and last-state captures remain authoritative; only a matching valid write tag consumes the corresponding early data. Physical write and visibility stay E2. TX and default payload callers retain their original data interface semantics.
    tx_ingress_control: Registered header_second, payload_phase and too_long flags predict the count boundaries. The write pointer has one owner and changes only for accepted stores or payload rollback; the legal 8192nd byte is stored and the following byte is rejected. A registered next full predicate uses the exact write/read pointer difference of 0x8000, including simultaneous read issue, store and rollback.
    rollback: Rejected TX messages restore their starting allocation pointer; older write commands retire before a replacement message can reuse the address. No rejected descriptor is published.
    map_ram: Existing afdx_app_map remains for configuration/identifier maps; WIDTH and AW parameters are preserved.
  tx:
    strategy: Retain paged shared message RAM; retain the head message until its last fragment; independently schedule every frame.
    context_pipeline: Synchronously read immutable datagram metadata, progress and builder-return pointers into a working snapshot before fragment arithmetic. Register normalized grant fields and next progress before committing the grant.
    context_storage: 128-entry single-write synchronous-read tables; 142-bit immutable metadata splits into five independent 32/32/32/32/14-bit RAMs with local phase-7 capture/write commands and phase-8 physical writes. Progress is written on each grant, pointers on builder completion. Only validity/busy bitmaps require reset.
    concurrency: A busy VL cannot become a grant candidate; pointer completion precedes snapshot consumption. Immutable metadata persists until the final fragment.
    busy_lookup: Sixteen groups of eight bitmap entries use independent local three-bit index registers. ENQ uses phases 1 and 2, committing with the snapshot at phase 4; scanning uses existing valid stages 1 and 2. GRANT active selection reads at phase 1, merges at phase 2 and is consumed at phase 5. Busy can only clear during ENQ/SCAN, so an older busy response is conservative.
    grant_commit: Phase 6 decodes the bitmap bank, phase 7 captures row and field-group commands, and phase 8 updates bitmap/RAM/grant outputs. Eight local grant-field groups preserve the original publication edge; fragment_done clear versus new grant set priority is retained.
    builder_capture: Grant inputs snapshot at E0 and load through nine local command groups at E1. Header template and checksum preparation add two clocks before prepared. Time subtraction and four partial due reductions are separate stages, with START_LEAD_REGISTERED=-8 preserving actual frame launch. Integrated now advances by one per clock modulo 32 bits; t_start reconstructs current now from the preceding now_input value using segmented increment. Packet byte throughput remains one byte per clock.
    input_elasticity: Core main/skid storage remains real storage with a registered ready prediction. The buffer adds two 49-bit input slots containing data, last, VL and ports. A free reserve slot pre-captures data using local occupancy; accepted valid controls ownership only, and occupied data holds through transfer. No slot or credit is added. An external last handshake closes message ingress until the original EVENT publishes its result. A local ingress_open predictor equals initialized-and-not-message_closed on every cycle, including initialization, last acceptance, EVENT reopening and reset; outward ready combines this local bit with the original registered capacity, preserving every external ready edge. A registered length_full predicts the 8192-byte boundary.
    completion_retirement: Pointer completion address/data and write command register locally. Builder additionally exposes the actual current last-byte handshake and active VL as an internal completion lookahead; sixteen engine banks capture a local completion command and three-bit row on the same edge that originally publishes fragment_done. Busy clears on the following original consumer edge, preserving scan/grant behavior and existing grant-commit priority; original fragment_done and pointer publication edges remain unchanged. The pointer table writes one clock later, before the next legal same-VL scan/grant snapshot. Free-return slots hold saved data while occupied until put retirement.
    payload_ram: Restore a single independent afdx_tx_payload_store synchronous RAM declaration with AW-bit address and eight-bit data; default AW17 retains 128 KiB, without explicit 16 KiB banking or lane slicing. Builder publishes the original read address/request at E0, physical RAM responds at E1, an independent preserved builder payload_qr captures at E2, and the original payload_pipe tag writes the FIFO at E3. Read requests, fetch_delay, return_pipe, FIFO/page-return capture and SOP/BAG timing remain unchanged. The store captures the entire write address/data each clock, with local write_command and separate write_qualifier sampling the same original write enable. Physical writes retire one clock later than the prior direct-write store; the buffer descriptor publication is unchanged, and existing enqueue/grant/builder preparation must keep every committed write visible before its first read. Qualifier-driven data LUT isolation must survive mapping. Reset clears write ownership; abandoned writes cannot create valid messages, and rollback/reuse ordering must preserve the final write before any address reuse. Requested-collision diagnostics compare actual physical write command/address with the same-edge read request/address. Mapping must confirm retained RAM inference and isolation; no native block count is assumed from source capacity.
    builder_fifo_pop: A local fifo_pop_eligible flag follows the staged output byte, including header-to-payload and final-payload transitions. Current ready combines with that one-bit prediction to consume FIFO data; header/part comparisons no longer sit in the ready-to-count feedback path.
    mac_fcs: Shift FCS on byte_en with CRC-load priority; a three-bit shift token selects the four FCS bytes. Wire bytes, EOF, DRAIN and 12-clock IFG are preserved.
    rollback_ram: Independent synchronous afdx_tx_rollback_ram captures page writes at E0 and writes at E1. RETURN publishes the read page one clock after issue and holds it until ret_ready; returned increments only on the return handshake and resets in IDLE.
    ipv4: Shared identification for a datagram; MF and offset on each fragment; UDP header on offset-zero fragment only.
    sn: Increment per Ethernet frame; A/B copies share frame SN.
    bag: Every fragment obeys the configured VL BAG based on actual frame launch.
    max_unfragmented_payload: 1471
    max_ip_fragment_data: 1479
    nonfinal_fragment_data_alignment: 8
    default_nonfinal_ip_data: 1472
    default_first_fragment_application_bytes: 1464
    lmax_rule: IP data budget is configured Lmax plus 8, capped at 1479; non-final data rounds down to an 8-byte multiple. Legacy <=1471 messages still obey configured Lmax.
    reclamation: Release a page only when all its bytes have been consumed or the entire message is discarded.
  rx:
    strategy: Per-frame FCS/IP validation and IC/RM precede bounded datagram reassembly; complete datagram validation precedes service/application delivery.
    context_key: [vl_index, source_ipv4, destination_ipv4, protocol, identification]
    contexts: 16
    max_application_bytes: 8192
    data_storage: Prefer 16 slots of 8192 application bytes; UDP header is metadata. No 4096-way payload allocation or wide CAM.
    timeout_cycles: 250000000
    behavior: Reject inconsistent totals, invalid alignment, overlaps and oversize datagrams; duplicates must not cause duplicate application delivery; expire incomplete contexts and reclaim all resources.
    ordering: Sequential fragment offsets only; missing-first, out-of-order and overlapping fragments are rejected. Existing per-frame IC/RM rules remain unchanged.
    admission: Registered context lookup and admission result precede RM acceptance. A query owns its selected context until commit or cancellation; timeout/reuse cannot invalidate an accepted reservation. Context and delivery-queue availability are checked before RM acceptance. Accepted fragments are copied out of the per-network staging ring; no partial datagram is exposed to applications.
    lookup_architecture: Two banks of eight contexts; slot bit 3 selects bank and bits 2:0 select row. Each bank scans eight synchronous key rows through a local RAM-return register and registered field comparisons before match summary. It then locks and revalidates the selected row through a local admission read command.
    key_scan_control: A bank-local eight-beat scan token predicts the existing Q2 through Q9 key-read window instead of repeatedly decoding the distributed query-age range. RAM row order, read edges, cancellation/watchdog behavior, key-write ownership and the Q19 result edge remain unchanged; token reset and restart follow the original transaction ownership.
    metadata_storage: Per bank, true synchronous single-read/single-write 8x92 key, 8x92 header, 8x28 admission and 8x46 progress tables, explicitly mapped to M4K. Valid/closed/complete/copy_initialized/pending/age and transaction ownership remain local registers.
    metadata_write_ownership: Allocation writes key/header/admission and clears copy_initialized; allocation never writes progress. Only copy retirement writes progress. Requests sharing the header read port are serialized; no table operation relies on same-address read/write values.
    endpoint_coordinates: Admission expected_end and total_ip include the UDP header. Query start/end retain 17 bits through validation; accepted IPv4 endpoints truncate to 14 bits afterwards. The first end is application fragment length plus 8, and application total is UDP length minus 8.
    control_service_target_cycles: 32
    control_service_target_note: Target is actual 125 MHz cycles including CE_DIV=2; does not establish byte-copy throughput. Current-batch engine integration measures 31 clocks take-to-resolve and 32 clocks paired-network take spacing. Simultaneous A/B completions remain buffered.
    query_latency_cycles: 19
    query_capture: Every request bit is sampled at external Q0. Local command preparation uses Q1 and key comparisons have their own FF stage; admission has a local RAM-read command. Inputs need not remain live after Q0. Watchdog remains anchored to external Q0.
    engine_schedule: Capture map at FRAME phase 5; register the query request at phase 6, with external bank Q0 at phase 7; capture result and local permission terms at phase 26, decide at 27, atomically accept queue/RM/reservation at 28, physically write bank/DQ at 29, and finish at 30. Permission preparation uses the exact next value of the existing registered queue-room recurrence, including phase-26 commit/pop. A phase-27 pop cannot retroactively authorize the original phase-27 decision; queue, reserve and RM share the same accepted predicate and original valid/ok checks. FRAME advances each clock; CE gates idle admission. Accepted registered writes are irrevocable despite subsequent cancellation. Engine uses an explicit one-hot operation state and local action predecode.
    lock_lifetime_cycles: 32
    copy_architecture: A prepared acknowledgement follows synchronous header/progress loading before the ring starts streaming. Incoming valid/last/data register locally at E0; checksum word selection and its enable register together, separating addition from distant copy control. Physical payload write remains E2; final-byte progress/pending retirement is E4 after write/checksum completion. Local checksum and position sustain one byte per clock; first copy uses header initial_sum and zero written, later copies load retired progress.
    row_control: Preserved per-row commit, retire and checksum-check command registers drive local lifecycle and pending updates; simultaneous commit and retire on one row leave pending unchanged. Local age_running predicts eligibility from merged lifecycle commands, age_reset follows commit/reclamation, and row_locked holds query ownership through commit/cancel/watchdog. State/config storage uses four-bit slices with local read command, synchronous RAM and local return; configuration is eight slices and state is ten four-bit slices plus one three-bit slice. Engine captures state/config at FRAME phase 10; AGE captures at 3 and writes back at 5. AGE retirement reuses the same age_tick selected by REGISTERED_TIME_TICK, including the original now_c change comparison in default standalone mode, rather than rebuilding a second coarse-time comparator. Existing physical write latency is preserved.
    admission_return: A local admission RAM return register at Q17 precedes combined bounds/comparison and admission at Q18; root response remains Q19. Per-row full flags follow the exact merged pending-counter next value on the same edge. Admission data may update without a remote enable, but only the original live valid tag publishes or latches its result; cancellation, watchdog and commit priority remain authoritative. Header output adds a seed phase after its arm phase. Segmented comparisons against length minus three and short-length seeds produce the original last-request edge for lengths one, two and larger without extending the five-clock payload read pipeline.
    initialization_and_configuration: Map initialization retains every cleared address and the original cleared/public init_done edges using segmented terminal prediction and write-slice-local clear address counters. Integrated engine configuration-ready FFs use a next-enable input that predicts exactly the core init_done recurrence, preserving equality with the original enable-and-quiet output on every cycle. The prediction parameter defaults off for standalone callers, which retain the original combinational enable qualification.
    ring_delivery: Replace the wide intermediate descriptor copy with grouped capture directly into the existing local header, length and first-ring-address registers. A local eligibility/fetch token samples current downstream ready at F0; F1 accepts the actual descriptor, publishes pop and advances its queue read pointer; F2 prepares length flags and header ownership. Start/empty is still generated from current ready and owned header, without remembering speculative ready credit. A one-shot prepared token starts the first ring-read command on the following edge; only the actual selected physical ring read advances the corresponding network release pointer. Empty messages release local ownership without a ring read or pointer movement. The next descriptor cannot overwrite metadata or in-flight bytes before the old last byte leaves deliver. Initial preparation may add one to three clocks; message byte throughput and buffer capacity remain unchanged.
    output_architecture: Select a completed bank/row, synchronously load its header, seed short-length/segmented-last state, prefetch payload, then output one byte per clock. Public VL/ports/net metadata must be stable at least three clocks before the first public valid byte, including legacy delivery, to preserve LOCAL_RX_PORT service capture. The revised preparation schedule targets eight clocks lead for reassembled messages and seven for legacy messages; final module integration must measure the implemented values. A quiet cycle still absorbs exactly the existing outstanding registered descriptor credit, without adding ownership capacity. Copy and output ownership remain serialized; control latency does not prove ring drain throughput.
    payload_storage: Two logical 65536-byte banks, each with eight 8192x8 slots, totaling 128 KiB. Each afdx_rx_reassembly_payload_slot contains four independent 8192x2 afdx_rx_reassembly_payload_lane instances, each with registered read/write commands, local addresses/results, a RAM declaration and write-data isolation. Intermediate VQM must retain 16 slot/64 lane identities, 128 write-isolation LUTs and 256 isolated RAM data-input connections; inline generate-array inference previously removed isolation. These are intermediate primitive counts, not native physical block utilization. Timeout age width is parameter-derived; default 28 bits.
    payload_pipeline: Slot-local lookahead write-address FFs use the bank's next address while incoming copy data captures at E0; the local lane command at E1 and physical payload write at E2 retain the copy schedule. A separate write_qualifier FF captures the same write-enable edge and drives only each lane's two data-isolation LUT inputs; write_command controls the RAM enable. Copy retirement remains E4. Read E0 command, E1 RAM, E2 local result, E3 registered pair reduction, E4 registered final OR, E5 bank consumes data. Valid/last and slot selection follow the same five-clock latency. Leaf lane identity, capacity and actual mapped input isolation remain required.
    events: Per-context registered events are reduced only after a register boundary; timeout uses local committed state.
    rejection_event: Existing per-network event bit 7 (0x80) also reports reassembly admission, timeout and completed-UDP checksum failures; it does not distinguish these causes.
    timeout_policy: Age advances only while a context is open and no accepted fragment is awaiting copy; successful reservation resets the age. A local registered age_due tracks the terminal count; the default 28-bit increment splits into 14-bit low/high sections with a registered predicted carry retained through pauses. While a selected row is locked, age saturates at expiry and reclamation waits for transaction resolution. A 32-clock watchdog prevents a lost query owner from locking a row forever. An already-registered commit_row_command suppresses reclamation at the following physical write edge, including a commit accepted at the watchdog boundary. Closed contexts drain to completion.
  service_channel:
    tx_arbitration: Preserve per-message round robin and byte handshakes. A local request snapshot and reselect/select_pending registers insert two quiet arbitration clocks with ready backpressure between messages before updating the one-hot source grant. A registered completed_message token updates the round-robin turn in the first existing quiet clock while the old served source remains stable; the next grant edge is unchanged. Sources hold bytes until ready; continuous packet throughput remains one byte per clock.
    rx_capture: Separate preserved SNMP, loader and application capture registers advance valid/data/last/VL/ports/net together by one clock to eliminate cross-chip service RX fanout. The minimum three-clock metadata lead is preserved. Application claim ownership qualifies the captured valid token; application last, like data, is passed from its capture FF and is meaningful only with valid. Claim/configuration does not gate the last datapath; valid-qualified application bytes and last retain their original cycles.
    rtc_response_control: Keep the original server receive/transmit seconds registers and normalization arithmetic. Eight byte-local capture permits plus a calculation-control permit predict the exact current response-accept condition from the original next-state recurrences; they do not delay acceptance or add a busy lock. Matching duplicate responses may still replace seconds during calculation. A same-edge abort retains any seconds-capture side effect permitted by the original ordering. Request timestamp arming, byte-index retirement/forwarding, TX state and segmented correction arithmetic retain public byte/event cycles and timestamp values; final saved-source comparisons must cover coincident ready, load, disable, role changes, calculation and repeated replies.
    destination_configuration: Existing cfg_ready and service_ready_next remain authoritative. Optional integrated destination-ready terms split the exact next-ready expression into service_ready_base OR service_ready_rx_term AND a same-cycle RX acknowledgment. Loader and RTC combine these terms locally, with default parameters preserving standalone legacy inputs. Integrated acknowledgment uses the final existing RX cfg_ok copy, whose data/reset recurrence is identical to copy zero; no new queue capacity or public acknowledgment delay is introduced. RTC raw host write request retains its complete 18-bit address-group qualification and local field decode. Byte-local write permits must match original ready/status eligibility on the actual write edge, preserving host priority, reset and busy semantics.
    rtc_rx_sampling: Integrated RTC uses RX_STREAM_DELAY_CYCLES=1 to select the exact pre-service-capture clock-history sample for both received_sec/ns and reply RX timestamp/fraction. The public root first-valid delivery edge remains the receive sampling boundary; internal ring-copy start/preparation and metadata lead are not timestamp events. Variable RX preparation must not be added as a fixed RTC history offset. Default zero preserves standalone behavior. History preserves time-load, clock-step and wrap boundaries; no fixed arithmetic subtraction replaces the original sampled time. TX and reference timestamp sampling are unchanged.
  timing:
    approach: Registered stage boundaries and local control; avoid new shared global enables or wide combinational scans.
    protected: [clock_frequency, setup_uncertainty, IC_RM_semantics, configuration_handshake, RTC_timestamp_semantics]
    local_timebase: Integrated SNMP enables LOCAL_TIMEBASE=1 and uses an independent afdx_timebase with the same clock and synchronous reset as the global counter. Integrated afdx_es additionally instantiates separate TX and RX afdx_timebase counters with identical clock/reset, preserving every counter value and wrap edge; TX receives the local full counter, RX receives its local bits 27:12 and the original one-clock registered low-12-bit terminal tick. Existing preserved/dont_merge counter and predicted-carry registers keep the counter state local. Global service/RTC time and byte_en remain on their original counter. Core standalone ports and arbitrary external now/now_c semantics are unchanged. These deterministic replicas add no observable cycle of delay; physical locality and timing benefit require fresh mapping/route evidence.
    service_configuration: Twenty-one preserved ready replicas follow the identical cfg_ready recurrence and gate individual SNMP/loader/RTC writable fields. Two additional app_cfg_ready FFs equal public cfg_ready every clock; reset-qualified service_ready_next predicts its next value. Integrated loader uses READY_PREDICT=1 and CFG_READY_PREDICT=1; three local running-ready FFs and seven field-ready FFs have the same reset and D values as their original source flags. Its cfg_write_request retains the full LOAD_ADDR_GROUP address qualification. Default-zero prediction parameters preserve original inputs and behavior. Write/acknowledgement cycles and two-clock reads remain unchanged.
    user_configuration: Two byte-local allowed FFs predict initialization and local-ready qualification using local initialization/acknowledgement and parallel idle/rearm terms; the current host/MIB request still determines the actual write edge. Any host write has priority, and RX configuration acknowledgement remains same-cycle.
    configuration_reads: Per-nibble preserved ten-way one-hot selection replaces serial group/shared selection in the configuration return. Loader and RTC choose the read address before combining selected data, preserving host/MIB priority and the existing two-clock public read latency.
    service_capture_and_output: SNMP captures candidate request data every clock and candidate address from local receiving/count, retaining first-byte address zero, subsequent byte addresses and the original write token/physical edge. Published pending length/port remain stable. Management TX retires queue takes one clock later; current counts subtract take_q and the effective head adds take_q to preserve original read/valid/completion cycles. Two candidate data banks sample only while locally unowned, with at most one public output byte owned. Ownership is derived from local tx_valid and output_read rather than separately registered remote-ready state; output_write equals output_read XOR tx_valid under the existing at-most-one-byte ownership invariant. Logical capacity remains eight queued/pending credits plus one output byte; invalid data may change and valid data remains stable through stalls.
    loader_commands: Engine publishes a three-bit deny format with the original deny CE edge; local write-address and format decode produce fixed bytes at the original physical RAM write edge. Legacy deny_wd remains available for standalone compatibility. CE_DIV2 captures and holds header address through the original E4 RAM read and response; CE_DIV1 retains its original two-stage address branch. Request-port/TID matching uses four-bit first-stage equality terms and the original second-stage reduction. Reason registers consume mutually exclusive state-event encoding instead of the large protocol next-state mux, retaining the original CE and update edges.
    snmp_uptime: A 7+7+7-bit cycle counter and predicted tick retain exactly 1250000 clocks per tick; byte-local tick copies and segmented carry retain exact 32-bit uptime and wrap. Preparing capture_length before pending does not change valid length or request acceptance.
    rtc_period: period_zero and period_read update with the accepted period write; countdown loading retains the original old-period/old-zero semantics for simultaneous operations. Seconds increment uses four bytes and prefix-full flags with unchanged output values and sampling edges. Tick overflow uses parallel mutually exclusive load/apply/ordinary-step terms with the original load priority.
    rtc_fraction: RTC enables LOCAL_CAPTURE=1 on its three NTP conversion instances. An external start at E0 produces done at E65 versus E64 in the compatible default branch; E65 may also accept the next start, preserving the original earliest 65-clock reacceptance window. Other busy-phase start pulses remain ignored. RTC consumes results only with the corresponding done and preserves the sampled-time source.
    parser_lengths: Fragment flags register with the offset field. Position-aligned local field pulses trigger the existing length phases; normalized end/length arithmetic precedes padding/limit selection, preserving 16-bit wrap behavior and first-payload admission timing.
    ram_write_data: Common core/app RAMs, TX context tables and reassembly payload RAM isolate write data with their write enable inside the synchronous write process. This preserves accepted writes and read latency while introducing a mapped input LUT for minimum-delay closure; verify retained structure and hold in each full netlist.
    exceptions: No new false paths or multicycle exceptions without actual clock-enable behavior. The three loader engine deny_format FFs deliberately retain single-cycle 8 ns timing. The checker explicitly proves their CE hold/phase and rejects adding them to an MCP collection. Only the obsolete empty deny_wd MCP group is removed after its registers disappear; all 253 remaining MCP groups retain their original requirements. Empty mapped collections fail the pre-pack audit.
    placement: Verified 1030 cluster placement locks are stored in elinx/tiles_1030.edc (11,044 clusters: 10,230 CLB + 814 M4K, PRES 1.30), closing all 96,142 routed endpoints at +0.029 ns setup and +0.604 ns hold; pass --no-tiles and re-optimize via tools/optimize_1030_clusters.py whenever synthesizable RTL changes.
